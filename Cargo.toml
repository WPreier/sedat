[package]
name = "sedat"
version = "0.1.5"
edition = "2021"
rust-version = "1.75"
description = "Minimal, high-security reverse proxy (companion to Seda)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/WPreier/sedat"
keywords = ["proxy", "reverse-proxy", "tls", "acme", "security"]
categories = ["network-programming", "web-programming"]

[features]
default = []
http3 = ["dep:quinn", "dep:h3", "dep:h3-quinn"]

[dependencies]
# Async runtime / HTTP
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "signal"] }
hyper = { version = "1.6", features = ["full"] }
hyper-util = { version = "0.1", features = ["full", "client", "client-legacy", "http1", "http2", "tokio"] }
http-body-util = "0.1"
http = "1.2"
bytes = "1.9"
h2 = "0.4"

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
rustls-pemfile = "2.2"
rustls-pki-types = "1.11"

# ACME
instant-acme = "0.7"
rcgen = "0.13"
hyper-rustls = { version = "0.27", features = ["http1", "http2", "ring", "tls12", "native-tokio"] }

# Config / serde
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
regex = "1.11"
thiserror = "2.0"
anyhow = "1.0"

# Logging (non-blocking)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Hot-swap / concurrency
arc-swap = "1.7"
parking_lot = "0.12"

# Rate limiting / hashing
dashmap = "6.1"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Misc
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
socket2 = "0.5"

# HTTP/3 (optional)
quinn = { version = "0.11", optional = true, default-features = false, features = ["runtime-tokio", "rustls"] }
h3 = { version = "0.0.6", optional = true }
h3-quinn = { version = "0.0.7", optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["user", "fs", "process"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3.15"
tokio-test = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
proptest = "1.6"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"

[[bin]]
name = "sedat"
path = "src/main.rs"

[[example]]
name = "hello_listen"
path = "examples/hello_listen.rs"

[[example]]
name = "config_demo"
path = "examples/config/config_demo.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
