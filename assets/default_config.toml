schema_version = 1

[server]
listen = "127.0.0.1:8080"
listen_tls = "127.0.0.1:8443"
http_redirect_listen = "127.0.0.1:8081"
state_dir = "./state"
admin_socket = "./state/admin.sock"
# admin_group = "sedat-admin"   # when set → socket mode 0660 + group
# admin_token = ""              # empty = FS ACL only (dev); set token in prod
# admin_token_file = "./state/admin.token"
# metrics_listen = "127.0.0.1:9090"  # optional loopback Prometheus sidecar

[tls]
enabled = false

[acme]
enabled = false
directory = "staging"
email = "admin@example.com"
domains = []
dns_provider = "file"
dns_file = "./state/acme-dns-challenge.txt"
# ari = true                 # prefer RFC 9773 renewalInfo when CA supports it
# renew_days_before = 30     # fallback when ARI unavailable

[[routes.hosts]]
host = "localhost"
[[routes.hosts.paths]]
prefix = "/"
upstream = "http://127.0.0.1:9080"
# upstream_allowlist = ["127.0.0.1"]  # optional pin; empty = unrestricted

[proxy_protocol]
outbound = "v2"
inbound_enabled = false
inbound_allowlist = []
inbound_placement = "before_tls"  # or "after_tls" for PP2 over TLS

[limits]
# Keep in sync with deploy/sedat.service MemoryMax / LimitNOFILE (docs P11.5).
max_connections = 1024
max_header_bytes = 16384
max_headers = 100
max_body_bytes = 1048576
request_timeout_secs = 30
idle_timeout_secs = 60
rate_limit_per_ip = 100
rate_limit_burst = 20
ban_after_rate_limit_strikes = 20
ban_duration_secs = 60
ban_extend_while_banned = true
ban_extend_min_interval_secs = 1

[embedded_docs]
enabled = true
sedat_path = "/sedat"
seda_path = "/seda"

[experimental]
h3 = false

[hardening]
landlock = "auto"   # auto | off | required (Linux)
seccomp = "auto"    # auto | off | required (BPF allowlist; auto→NO_NEW_PRIVS fallback)

[logging]
level = "info"
request_id = true
request_id_header = "x-request-id"
# audit_jsonl = "./state/audit.jsonl"   # empty / unset = disabled
audit_jsonl = ""
audit_jsonl_max_bytes = 10485760
