name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Linux (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: HTTP/3 clippy
        run: cargo clippy --features http3 --all-targets -- -D warnings
      - name: HTTP/3 attack corpus
        run: cargo test --features http3 --test h3_attack_corpus
      - name: HTTP/3 request proxy smoke
        run: cargo test --features http3 --test h3_proxy
      - name: Build release
        run: cargo build --release

  docker-smoke:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Compose config valid
        run: docker compose -f docker-compose.dev.yml config >/dev/null

  pebble-issue:
    name: Pebble ACME issuance
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start Pebble
        run: |
          set -euo pipefail
          docker compose -f docker-compose.dev.yml --profile acme up -d pebble
          ready=0
          for i in $(seq 1 60); do
            if curl -skf https://localhost:14000/dir >/dev/null; then
              echo "pebble directory ready after ${i}s"
              ready=1
              break
            fi
            # Fail fast if the container already exited (bad command / crash).
            if ! docker compose -f docker-compose.dev.yml --profile acme ps --status running --services | grep -qx pebble; then
              echo "pebble container not running after ${i}s"
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "=== pebble ps ==="
            docker compose -f docker-compose.dev.yml --profile acme ps -a || true
            echo "=== pebble logs ==="
            docker compose -f docker-compose.dev.yml --profile acme logs pebble || true
            exit 1
          fi
          curl -skf https://localhost:14000/dir
      - name: Issue certificate via Pebble
        env:
          PEBBLE_DIRECTORY: https://localhost:14000/dir
          SEDAT_PEBBLE_ISSUE_STATE: ${{ runner.temp }}/sedat-pebble
        run: |
          mkdir -p "$SEDAT_PEBBLE_ISSUE_STATE"
          cargo test --test pebble_issue -- --ignored --nocapture
          test -f "$SEDAT_PEBBLE_ISSUE_STATE/cert.pem"
          test -f "$SEDAT_PEBBLE_ISSUE_STATE/key.pem"
      - name: Stop Pebble
        if: always()
        run: docker compose -f docker-compose.dev.yml --profile acme down

# Windows development is via WSL2 or Docker — see docs/DEV_SETUP.md.
# Native Windows builds are best-effort; privilege-drop / systemd tests skip there.
