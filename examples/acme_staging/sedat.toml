schema_version = 1

[server]
listen = "127.0.0.1:8080"
listen_tls = "127.0.0.1:8443"
http_redirect_listen = "127.0.0.1:8081"
state_dir = "./state"
admin_socket = "./state/admin.sock"

[tls]
enabled = true

[acme]
enabled = true
directory = "staging"
email = "admin@example.com"
domains = ["localhost"]
dns_provider = "file"
dns_file = "./state/acme-dns-challenge.txt"

[[routes.hosts]]
host = "localhost"
[[routes.hosts.paths]]
prefix = "/"
upstream = "http://127.0.0.1:9080"

[proxy_protocol]
outbound = "v2"
inbound_enabled = false
inbound_allowlist = []

[limits]
max_connections = 256
max_header_bytes = 16384
max_headers = 100
max_body_bytes = 1048576
request_timeout_secs = 30
idle_timeout_secs = 60
rate_limit_per_ip = 50
rate_limit_burst = 10

[embedded_docs]
enabled = true
sedat_path = "/sedat"
seda_path = "/seda"

[experimental]
h3 = false

[logging]
level = "info"
